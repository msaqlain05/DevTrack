{% extends "base.html" %}
{% block title %}DevTrack – Project{% endblock %}

{% block content %}
<div class="page-header" id="projectHeader">
  <a href="/dashboard" class="back-link">← Back to Dashboard</a>
  <div class="flex-between">
    <div>
      <h1 id="projTitle" class="skeleton" style="width:200px;height:32px;border-radius:6px;"></h1>
      <p id="projDesc" class="text-muted text-sm mb-2"></p>
    </div>
    <button class="btn btn-danger btn-sm" id="deleteProjBtn" style="display:none" onclick="deleteProject()">Delete project</button>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar mb-3">
  <h3 style="margin:0;font-size:.9375rem;">Tasks</h3>
  <div class="toolbar-spacer"></div>
  <input type="date" id="filterDate" class="form-control" style="width:auto;" onchange="loadTasks()">
  <button class="btn btn-sm" id="clearFilter" style="display:none" onclick="clearDateFilter()">✕ Clear</button>
  <button class="btn btn-primary btn-sm" id="addTaskBtn" onclick="toggleTaskForm()">＋ Add task</button>
</div>

<!-- Inline task form -->
<div class="inline-form" id="taskForm">
  <div class="inline-form-inner">
    <form onsubmit="handleCreateTask(event)">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input class="form-control" id="taskTitle" placeholder="What needs to be done?" required>
        </div>
        <div class="form-group">
          <label class="form-label">Target date</label>
          <input class="form-control" type="date" id="taskDate">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input class="form-control" id="taskDesc" placeholder="Optional notes">
      </div>
      <div class="flex gap-2" style="justify-content:flex-end">
        <button type="button" class="btn btn-ghost btn-sm" onclick="toggleTaskForm()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" id="taskSubmitBtn">Save task</button>
      </div>
    </form>
  </div>
</div>

<!-- Task list -->
<div id="tasksList">
  <div class="skeleton skeleton-card"></div>
  <div class="skeleton skeleton-card"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (!localStorage.getItem('token')) window.location.href = '/login';

  const projectId = window.location.pathname.split('/').pop();

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Load Project Header ─────────────────────────────────────────
  async function loadProject() {
    try {
      const p = await apiFetch(`/projects/${projectId}`);
      const titleEl = document.getElementById('projTitle');
      titleEl.textContent = p.name;
      titleEl.classList.remove('skeleton');
      titleEl.style = '';
      document.getElementById('projDesc').textContent = p.description || '';
      document.getElementById('deleteProjBtn').style.display = '';
    } catch {
      document.getElementById('projTitle').textContent = 'Project not found';
    }
  }

  // ── Load Tasks ──────────────────────────────────────────────────
  async function loadTasks() {
    const filterDate = document.getElementById('filterDate').value;
    document.getElementById('clearFilter').style.display = filterDate ? '' : 'none';

    const url = filterDate
      ? `/tasks/project/${projectId}?date=${filterDate}`
      : `/tasks/project/${projectId}`;

    // Show skeletons while loading
    const tList = document.getElementById('tasksList');
    tList.innerHTML = `<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>`;

    try {
      const tasks = await apiFetch(url);
      tList.innerHTML = '';

      if (!tasks.length) {
        tList.innerHTML = `<div class="empty-state">
          <span class="empty-icon">${filterDate ? '🔍' : '📋'}</span>
          <p>${filterDate ? `No tasks on ${filterDate}.` : 'No tasks yet.<br>Add one to get started!'}</p>
        </div>`;
        return;
      }

      tasks.forEach((t, i) => {
        const isDone = t.status === 'completed';
        const item   = document.createElement('div');
        item.className = `task-item${isDone ? ' done' : ''}`;
        item.id = `task-${t.id}`;
        item.style.animationDelay = `${i * 0.04}s`;
        item.innerHTML = `
          <div style="min-width:0;flex:1">
            <div class="task-title">${escHtml(t.title)}</div>
            ${t.description ? `<div class="text-muted text-sm mb-1">${escHtml(t.description)}</div>` : ''}
            <div class="task-meta">
              <span class="badge badge-${t.status}">${t.status.replace('-',' ')}</span>
              ${t.date ? `<span>🗓 ${t.date}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <select class="status-select" onchange="updateStatus(${t.id}, this.value)">
              <option value="pending"     ${t.status==='pending'     ?'selected':''}>Pending</option>
              <option value="in-progress" ${t.status==='in-progress' ?'selected':''}>In Progress</option>
              <option value="completed"   ${t.status==='completed'   ?'selected':''}>Completed</option>
            </select>
            <button class="btn btn-danger btn-sm" onclick="deleteTask(${t.id})">Del</button>
          </div>`;
        tList.appendChild(item);
      });
    } catch (err) {
      tList.innerHTML = `<div class="empty-state"><p class="text-muted">Failed to load tasks.</p></div>`;
    }
  }

  function clearDateFilter() {
    document.getElementById('filterDate').value = '';
    document.getElementById('clearFilter').style.display = 'none';
    loadTasks();
  }

  // ── Form toggle ─────────────────────────────────────────────────
  function toggleTaskForm() {
    const form = document.getElementById('taskForm');
    const btn  = document.getElementById('addTaskBtn');
    const open = form.classList.toggle('open');
    btn.textContent = open ? '✕ Close' : '＋ Add task';
    if (open) {
      const filter = document.getElementById('filterDate').value;
      if (filter) document.getElementById('taskDate').value = filter;
      setTimeout(() => document.getElementById('taskTitle').focus(), 80);
    }
  }

  // ── Create Task ─────────────────────────────────────────────────
  async function handleCreateTask(e) {
    e.preventDefault();
    const title = document.getElementById('taskTitle').value.trim();
    const desc  = document.getElementById('taskDesc').value.trim();
    const date  = document.getElementById('taskDate').value;
    const btn   = document.getElementById('taskSubmitBtn');

    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await apiFetch('/tasks/', {
        method: 'POST',
        body: JSON.stringify({ title, description: desc || null, date: date || null, project_id: parseInt(projectId) })
      });
      toggleTaskForm();
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDesc').value  = '';
      showToast('Task added ✓', 'success');
      loadTasks();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Save task';
    }
  }

  // ── Update Status ───────────────────────────────────────────────
  async function updateStatus(taskId, status) {
    try {
      await apiFetch(`/tasks/${taskId}`, { method: 'PUT', body: JSON.stringify({ status }) });
      showToast(`Marked as ${status.replace('-',' ')}`, 'success');
      loadTasks();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // ── Delete Task ─────────────────────────────────────────────────
  async function deleteTask(taskId) {
    if (!confirm('Delete this task? This cannot be undone.')) return;
    try {
      await apiFetch(`/tasks/${taskId}`, { method: 'DELETE' });
      // Animate removal
      const el = document.getElementById(`task-${taskId}`);
      if (el) { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; }
      setTimeout(() => loadTasks(), 250);
      showToast('Task deleted', 'success');
    } catch (err) { showToast(err.message, 'error'); }
  }

  // ── Delete Project ──────────────────────────────────────────────
  async function deleteProject() {
    if (!confirm('Delete this project AND all its tasks?')) return;
    try {
      await apiFetch(`/projects/${projectId}`, { method: 'DELETE' });
      window.location.href = '/dashboard';
    } catch (err) { showToast(err.message, 'error'); }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadProject();
    loadTasks();
  });
</script>
{% endblock %}
