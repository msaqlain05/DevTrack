{% extends "base.html" %}

{% block title %}DevTrack - Project View{% endblock %}

{% block content %}
<!-- Header injected by JS once project loads -->
<div id="projectHeader" class="mb-4">
    <a href="/dashboard" style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1rem; display: inline-block;">&larr; Back to Dashboard</a>
    <h1>Loading Project...</h1>
</div>

<div class="card mb-4" style="background: var(--bg-color);">
    <div class="flex-between">
        <h3 style="margin: 0;">Tasks</h3>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <input type="date" id="filterDate" class="form-control" style="width: auto; padding: 0.3rem 0.5rem;" onchange="loadProjectData()">
            <button class="btn btn-primary" onclick="toggleTaskForm()">+ Add Task</button>
        </div>
    </div>
</div>

<div class="card" id="taskFormCard" style="display: none; border-color: var(--accent-color); margin-bottom: 1.5rem;">
    <form onsubmit="handleCreateTask(event)">
        <div class="grid">
            <div class="form-group">
                <label class="form-label">Task Title</label>
                <input type="text" id="taskTitle" class="form-control" placeholder="What needs to be done?" required>
            </div>
            <div class="form-group">
                <label class="form-label">Target Date (Optional)</label>
                <input type="date" id="taskDate" class="form-control">
            </div>
        </div>
        <div class="form-group">
             <input type="text" id="taskDesc" class="form-control" placeholder="Description (optional)">
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
            <button type="button" class="btn" onclick="toggleTaskForm()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
    </form>
</div>

<div id="tasksList">
    <div style="color: var(--text-secondary); text-align: center; margin-top: 2rem;">Loading tasks...</div>
</div>

{% endblock %}

{% block scripts %}
<script>
    if (!localStorage.getItem('token')) {
        window.location.href = '/login';
    }

    // Extract project ID gracefully from Jinja routing URL
    const projectId = window.location.pathname.split('/').pop();

    function toggleTaskForm() {
        const tForm = document.getElementById('taskFormCard');
        tForm.style.display = tForm.style.display === 'none' ? 'block' : 'none';
        
        // Auto-fill form date with filter date if active
        if (tForm.style.display === 'block') {
            const filterDate = document.getElementById('filterDate').value;
            if(filterDate) document.getElementById('taskDate').value = filterDate;
        }
    }

    async function loadProjectData() {
        try {
            // 1. Load Project Header
            const project = await apiFetch(`/projects/${projectId}`);
            document.getElementById('projectHeader').innerHTML = `
                <a href="/dashboard" style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1rem; display: inline-block;">&larr; Back to Dashboard</a>
                <div class="flex-between">
                    <div>
                        <h1 style="margin-bottom: 0.5rem;">${project.name}</h1>
                        <p style="color: var(--text-secondary); font-size: 0.875rem;">${project.description || 'No description provided.'}</p>
                    </div>
                    <button class="btn btn-danger" onclick="deleteProject()">Delete Project</button>
                </div>
            `;

            // 2. Load Tasks (Respecting Filters)
            const filterDate = document.getElementById('filterDate').value;
            let url = `/tasks/project/${projectId}`;
            if (filterDate) url += `?date=${filterDate}`;

            const tasks = await apiFetch(url);
            const tList = document.getElementById('tasksList');
            
            tList.innerHTML = '';
            if (tasks.length === 0) {
                tList.innerHTML = `<div class="card"><div class="card-text text-center" style="margin:0;">No tasks found.</div></div>`;
            } else {
                tasks.forEach(t => {
                    const isDone = t.status === 'completed';
                    tList.innerHTML += `
                        <div class="card" style="display: flex; justify-content: space-between; align-items: flex-start; opacity: ${isDone ? '0.6' : '1'}">
                            <div>
                                <div style="font-weight: 500; font-size: 1rem; margin-bottom: 0.2rem; text-decoration: ${isDone ? 'line-through' : 'none'}">${t.title}</div>
                                ${t.description ? `<div class="card-text" style="margin-bottom: 0.5rem;">${t.description}</div>` : ''}
                                <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem;">
                                    <span class="status-badge status-${t.status}">${t.status.replace('-', ' ')}</span>
                                    ${t.date ? `<span style="color: var(--text-secondary); font-size: 0.75rem;">🗓 ${t.date}</span>` : ''}
                                </div>
                            </div>
                            <div style="display: flex; gap: 0.5rem;">
                                <select class="form-control" style="width: 120px; padding: 0.25rem 0.5rem; font-size: 0.75rem;" onchange="updateTaskStatus(${t.id}, this.value)">
                                    <option value="pending" ${t.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="in-progress" ${t.status === 'in-progress' ? 'selected' : ''}>In-Progress</option>
                                    <option value="completed" ${t.status === 'completed' ? 'selected' : ''}>Completed</option>
                                </select>
                                <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="deleteTask(${t.id})">Del</button>
                            </div>
                        </div>
                    `;
                });
            }
        } catch (err) {
            console.error(err);
            // Non-owners hitting this page will get 403 / 404 naturally
            document.getElementById('projectHeader').innerHTML = `<h1>Project not found or unauthorized</h1>`;
        }
    }

    async function handleCreateTask(e) {
        e.preventDefault();
        const title = document.getElementById('taskTitle').value;
        const desc = document.getElementById('taskDesc').value;
        const targetDate = document.getElementById('taskDate').value;
        const btn = e.target.querySelector('button[type="submit"]');

        try {
            btn.disabled = true;
            await apiFetch('/tasks/', {
                method: 'POST',
                body: JSON.stringify({ 
                    title, 
                    description: desc || null,
                    date: targetDate || null,
                    project_id: parseInt(projectId)
                })
            });
            toggleTaskForm();
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            loadProjectData(); // Reload silently
        } catch (err) {
            alert("Error creating task: " + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    async function updateTaskStatus(taskId, newStatus) {
        try {
            await apiFetch(`/tasks/${taskId}`, {
                method: 'PUT',
                body: JSON.stringify({ status: newStatus })
            });
            loadProjectData();
        } catch (err) {
            alert("Error updating task: " + err.message);
        }
    }

    async function deleteTask(taskId) {
        if(!confirm("Are you sure you want to delete this task?")) return;
        try {
            await apiFetch(`/tasks/${taskId}`, { method: 'DELETE' });
            loadProjectData();
        } catch (err) {
            alert("Error deleting task: " + err.message);
        }
    }

    async function deleteProject() {
        if(!confirm("DANGER: This will delete the project and all its tasks! Are you absolutely sure?")) return;
        try {
            await apiFetch(`/projects/${projectId}`, { method: 'DELETE' });
            window.location.href = '/dashboard';
        } catch (err) {
            alert("Error deleting project: " + err.message);
        }
    }

    document.addEventListener("DOMContentLoaded", loadProjectData);
</script>
{% endblock %}
