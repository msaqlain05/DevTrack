<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}DevTrack{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <nav class="navbar">
      <span class="brand">DevTrack</span>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>&copy; 2026 DevTrack</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
