{% extends "base.html" %}
{% block title %}DevTrack – Dashboard{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}

<!-- ── Welcome header ────────────────────────────────────────── -->
<div class="flex-between mb-3" style="animation: fadeInDown .35s ease-out;">
  <div>
    <h1 style="margin-bottom:.2rem;">Dashboard</h1>
    <p class="text-muted text-sm" id="welcomeLine">Loading your workspace…</p>
  </div>
  <button class="btn btn-primary" id="newProjBtn" onclick="toggleProjectForm()">＋ New project</button>
</div>

<!-- ── Inline create form ────────────────────────────────────── -->
<div class="inline-form mb-3" id="projectForm">
  <div class="inline-form-inner">
    <form onsubmit="handleCreateProject(event)">

      <!-- Row 1: Name + Type -->
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Project name *</label>
          <input class="form-control" id="projName" placeholder="e.g. My Portfolio" required>
        </div>
        <div class="form-group">
          <label class="form-label">Project type</label>
          <select class="form-control" id="projType">
            <option value="">— Select type —</option>
            <option value="web-app">🌐 Web App</option>
            <option value="website">📄 Website</option>
            <option value="mobile-app">📱 Mobile App</option>
            <option value="desktop-app">🖥 Desktop App</option>
            <option value="api">🔌 API / Service</option>
            <option value="cli">⌨️ CLI Tool</option>
            <option value="library">📦 Library / SDK</option>
            <option value="other">🔧 Other</option>
          </select>
        </div>
      </div>

      <!-- Row 2: Description + Role -->
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Description</label>
          <input class="form-control" id="projDesc" placeholder="Optional — brief summary">
        </div>
        <div class="form-group">
          <label class="form-label">Dev role</label>
          <select class="form-control" id="projRole" onchange="updateTechOptions()">
            <option value="">— Select role —</option>
            <option value="fullstack">⚡ Full Stack</option>
            <option value="frontend">🎨 Frontend</option>
            <option value="backend">⚙️ Backend</option>
          </select>
        </div>
      </div>

      <!-- Row 3: Language + Framework (dynamic) -->
      <div class="grid-2" id="techRow" style="display:none;">
        <div class="form-group">
          <label class="form-label">Language</label>
          <select class="form-control" id="projLang" onchange="updateFrameworks()">
            <option value="">— Select language —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Framework</label>
          <select class="form-control" id="projFramework">
            <option value="">— Select framework —</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2" style="justify-content:flex-end">
        <button type="button" class="btn btn-ghost btn-sm" onclick="toggleProjectForm()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" id="projSubmitBtn">Create project</button>
      </div>
    </form>
  </div>
</div>


<!-- ── Stats row ─────────────────────────────────────────────── -->
<div class="stats-row mb-4" id="statsRow">
  <div class="stat-card skeleton" id="s-projects" style="height:88px;border-radius:var(--radius);"></div>
  <div class="stat-card skeleton" id="s-tasks" style="height:88px;border-radius:var(--radius);"></div>
  <div class="stat-card skeleton" id="s-done" style="height:88px;border-radius:var(--radius);"></div>
  <div class="stat-card skeleton" id="s-active" style="height:88px;border-radius:var(--radius);"></div>
</div>

<!-- ── Charts row ────────────────────────────────────────────── -->
<div class="charts-row mb-4">
  <div class="chart-card">
    <p class="chart-label">Task Status</p>
    <div style="position:relative;height:200px;">
      <canvas id="statusChart"></canvas>
    </div>
  </div>
  <div class="chart-card" style="flex:2;">
    <p class="chart-label">Tasks per Project</p>
    <div style="position:relative;height:200px;">
      <canvas id="projectChart"></canvas>
    </div>
  </div>
</div>

<!-- ── Projects + Tasks ──────────────────────────────────────── -->
<section>
  <div class="section-header">
    <h2>Projects</h2>
  </div>
  <div id="projectsList">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script>
  if (!localStorage.getItem('token')) window.location.href = '/login';

  let projectsCache = {};
  let statusChartInst = null;
  let projectChartInst = null;

  // ── XSS helper ─────────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Project form toggle ─────────────────────────────────────────
  function toggleProjectForm() {
    const form = document.getElementById('projectForm');
    const btn = document.getElementById('newProjBtn');
    const open = form.classList.toggle('open');
    btn.textContent = open ? '✕ Close' : '＋ New project';
    if (open) setTimeout(() => document.getElementById('projName').focus(), 60);
  }

  // ── Stat card renderer ──────────────────────────────────────────
  function setStatCard(id, icon, label, value, color) {
    const el = document.getElementById(id);
    el.classList.remove('skeleton');
    el.style.height = '';
    el.style.borderRadius = '';
    el.innerHTML = `
      <div class="stat-icon" style="color:${color};background:${color}22;">${icon}</div>
      <div>
        <div class="stat-value">${value}</div>
        <div class="stat-label">${label}</div>
      </div>`;
  }

  // ── Chart renderer ──────────────────────────────────────────────
  const C = {
    pending: '#e3b341',
    active: '#58a6ff',
    completed: '#3fb950',
    grid: '#30363d',
    text: '#8b949e',
    bg: '#161b22',
  };

  function buildStatusChart(pending, active, done) {
    const ctx = document.getElementById('statusChart');
    if (statusChartInst) statusChartInst.destroy();
    statusChartInst = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Pending', 'In Progress', 'Completed'],
        datasets: [{
          data: [pending, active, done],
          backgroundColor: [C.pending, C.active, C.completed],
          borderColor: C.bg,
          borderWidth: 3,
          hoverOffset: 6,
        }]
      },
      options: {
        cutout: '68%',
        animation: { duration: 800, easing: 'easeOutQuart' },
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: C.text, padding: 14, boxWidth: 10, font: { size: 11 } }
          },
          tooltip: { backgroundColor: '#1c2128', borderColor: C.grid, borderWidth: 1 }
        }
      }
    });
  }

  function buildProjectChart(labels, data) {
    const ctx = document.getElementById('projectChart');
    if (projectChartInst) projectChartInst.destroy();
    projectChartInst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Tasks',
          data,
          backgroundColor: data.map(() => C.active + '88'),
          borderColor: data.map(() => C.active),
          borderWidth: 2,
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        animation: { duration: 700, easing: 'easeOutQuart' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1c2128', borderColor: C.grid, borderWidth: 1, callbacks: {
              label: ctx => ` ${ctx.parsed.y} task${ctx.parsed.y !== 1 ? 's' : ''}`
            }
          }
        },
        scales: {
          x: {
            ticks: { color: C.text, font: { size: 11 } },
            grid: { display: false },
            border: { color: C.grid }
          },
          y: {
            ticks: { color: C.text, stepSize: 1, font: { size: 11 } },
            grid: { color: C.grid + '55' },
            border: { color: 'transparent' },
            beginAtZero: true,
          }
        }
      }
    });
  }

  // ── Main data loader ────────────────────────────────────────────
  async function loadDashboard() {
    try {
      const [projects, tasks] = await Promise.all([
        apiFetch('/projects/'),
        apiFetch('/tasks/')
      ]);

      // Welcome line
      document.getElementById('welcomeLine').textContent =
        `${projects.length} project${projects.length !== 1 ? 's' : ''} · ${tasks.length} task${tasks.length !== 1 ? 's' : ''}`;

      // ── Stats ─────────────────────────────────────────────────
      const pending = tasks.filter(t => t.status === 'pending').length;
      const active = tasks.filter(t => t.status === 'in-progress').length;
      const done = tasks.filter(t => t.status === 'completed').length;

      setStatCard('s-projects', '🗂', 'Projects', projects.length, '#58a6ff');
      setStatCard('s-tasks', '📋', 'Total Tasks', tasks.length, '#8b949e');
      setStatCard('s-done', '✅', 'Completed', done, '#3fb950');
      setStatCard('s-active', '🔄', 'In Progress', active, '#e3b341');

      // ── Charts ────────────────────────────────────────────────
      buildStatusChart(pending, active, done);

      // Tasks per project
      const perProject = {};
      projects.forEach(p => { perProject[p.id] = { name: p.name, count: 0 }; });
      tasks.forEach(t => { if (perProject[t.project_id]) perProject[t.project_id].count++; });
      const projLabels = Object.values(perProject).map(p => p.name);
      const projData = Object.values(perProject).map(p => p.count);
      buildProjectChart(projLabels, projData);

      // ── Projects list ─────────────────────────────────────────
      const pList = document.getElementById('projectsList');
      pList.innerHTML = '';
      if (!projects.length) {
        pList.innerHTML = `<div class="empty-state">
          <span class="empty-icon">🗂</span>
          <p>No projects yet.<br>Create one to get started.</p></div>`;
      } else {
        projects.forEach((p, i) => {
          const taskCount = perProject[p.id]?.count ?? 0;
          const a = document.createElement('a');
          a.className = 'project-card';
          a.href = `/project/${p.id}`;
          a.style.animationDelay = `${i * 0.05}s`;

          const TYPE_ICONS = { 'web-app':'🌐','website':'📄','mobile-app':'📱','desktop-app':'🖥','api':'🔌','cli':'⌨️','library':'📦','other':'🔧' };
          const ROLE_LABELS = { 'fullstack':'⚡ Full Stack','frontend':'🎨 Frontend','backend':'⚙️ Backend' };

          const typePill  = p.project_type ? `<span class="meta-pill">${TYPE_ICONS[p.project_type] || ''} ${p.project_type.replace('-',' ')}</span>` : '';
          const rolePill  = p.role         ? `<span class="meta-pill">${ROLE_LABELS[p.role] || p.role}</span>` : '';
          const langPill  = p.language     ? `<span class="meta-pill lang-pill">${p.language}</span>` : '';
          const framePill = p.framework    ? `<span class="meta-pill frame-pill">${p.framework}</span>` : '';

          a.innerHTML = `
            <div class="card-title">${escHtml(p.name)}</div>
            <div class="card-meta" style="margin:.3rem 0 .6rem;">${p.description ? escHtml(p.description) : ''}</div>
            <div class="meta-pills">
              ${typePill}${rolePill}${langPill}${framePill}
              <span class="meta-pill task-pill">${taskCount} task${taskCount !== 1 ? 's' : ''}</span>
            </div>`;
          pList.appendChild(a);
        });
      }

    } catch (err) {
      console.error('Dashboard error:', err);
    }
  }

  async function handleCreateProject(e) {
    e.preventDefault();
    const name      = document.getElementById('projName').value.trim();
    const desc      = document.getElementById('projDesc').value.trim();
    const proj_type = document.getElementById('projType').value;
    const role      = document.getElementById('projRole').value;
    const language  = document.getElementById('projLang').value;
    const framework = document.getElementById('projFramework').value;
    const btn = document.getElementById('projSubmitBtn');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      await apiFetch('/projects/', { method: 'POST', body: JSON.stringify({
        name,
        description:  desc      || null,
        project_type: proj_type || null,
        role:         role      || null,
        language:     language  || null,
        framework:    framework || null,
      })});
      toggleProjectForm();
      ['projName','projDesc','projType','projRole','projLang','projFramework'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('techRow').style.display = 'none';
      showToast('Project created! 🚀', 'success');
      loadDashboard();
    } catch (err) { showToast(err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Create project'; }
  }

  // ── Tech stack logic ────────────────────────────────────────────
  const TECH_MAP = {
    frontend: {
      'JavaScript':    ['React','Vue.js','Angular','Svelte','Solid.js','Astro','Preact','Alpine.js','Backbone.js'],
      'TypeScript':    ['React','Vue.js','Angular','Svelte','Next.js','Nuxt.js','Remix','Qwik'],
      'CSS / HTML':    ['Tailwind CSS','Bootstrap','Bulma','Foundation','Materialize','Pico CSS'],
      'Dart':          ['Flutter Web'],
      'Elm':           ['Elm (No framework)'],
      'ClojureScript': ['Re-frame','Reagent'],
    },
    backend: {
      'Python':        ['FastAPI','Django','Flask','Tornado','Litestar','Falcon','Bottle','Quart'],
      'JavaScript':    ['Express','NestJS','Fastify','Hapi.js','Koa','AdonisJS','Feathers.js'],
      'TypeScript':    ['NestJS','Express','Fastify','AdonisJS','Hono'],
      'Go':            ['Gin','Fiber','Echo','Chi','Gorilla Mux','Beego','Buffalo','Revel'],
      'Java':          ['Spring Boot','Quarkus','Micronaut','Jakarta EE','Dropwizard','Vert.x','Helidon'],
      'Kotlin':        ['Spring Boot','Ktor','Micronaut','Vert.x'],
      'C#':            ['ASP.NET Core','Minimal APIs','Carter','FastEndpoints'],
      'PHP':           ['Laravel','Symfony','CodeIgniter','CakePHP','Slim','Laminas','Phalcon','Yii'],
      'Ruby':          ['Rails','Sinatra','Hanami','Padrino','Grape'],
      'Rust':          ['Actix-web','Axum','Rocket','Warp','Salvo','Poem'],
      'Elixir':        ['Phoenix','Plug','Bandit'],
      'Scala':         ['Play Framework','Akka HTTP','http4s','Tapir'],
      'Haskell':       ['Servant','Yesod','Scotty','Snap'],
      'Clojure':       ['Luminus','Compojure','Reitit','Pedestal'],
      'Dart':          ['Shelf','Dart Frog'],
      'Swift':         ['Vapor','Hummingbird'],
      'Perl':          ['Dancer2','Mojolicious','Catalyst'],
      'Lua':           ['OpenResty / NGINX','Lapis'],
      'OCaml':         ['Dream','Cohttp'],
      'F#':            ['Giraffe','Falco','ASP.NET Core (F#)'],
      'Nim':           ['Mummy','Prologue','Jester'],
      'Zig':           ['Zap','http.zig'],
      'Julia':         ['Genie.jl','HTTP.jl'],
      'R':             ['Plumber','RestRserve'],
      'C / C++':       ['Drogon','CppCMS','Crow','uWebSockets','Pistache'],
    },
    fullstack: {
      'JavaScript':    ['Next.js','Nuxt.js','Remix','SvelteKit','Astro','Redwood.js','Blitz.js'],
      'TypeScript':    ['Next.js','Nuxt.js','Remix','SvelteKit','Analog','Qwik City'],
      'Python':        ['Django (Full Stack)','Flask + HTMX','FastAPI + Jinja2','Litestar + HTMX'],
      'PHP':           ['Laravel (Full Stack)','Symfony (Full Stack)','WordPress','Drupal'],
      'Ruby':          ['Rails (Full Stack)','Hotwire + Rails'],
      'Elixir':        ['Phoenix LiveView'],
      'Kotlin':        ['Ktor Full Stack','Kotlin + HTMX'],
      'Java':          ['Spring Boot (Full Stack)','Vaadin','JHipster'],
      'C#':            ['Blazor','ASP.NET Core MVC','Razor Pages'],
      'Clojure':       ['Luminus Full Stack','Fulcro'],
      'Scala':         ['Play Framework (Full)'],
      'Go':            ['Go + Templ','Go + HTMX'],
    },
  };

  const MOBILE_LANGS = {
    'Dart':            ['Flutter'],
    'Swift':           ['SwiftUI','UIKit','SwiftData','Combine'],
    'Kotlin':          ['Jetpack Compose','Android SDK','Compose Multiplatform'],
    'Java':            ['Android SDK (Java)','Spring Android'],
    'JavaScript':      ['React Native','Expo','Ionic','NativeScript','Capacitor'],
    'TypeScript':      ['React Native','Expo','Ionic','NativeScript'],
    'C#':              ['MAUI (.NET)','Xamarin','Uno Platform'],
    'C++':             ['Qt for Mobile','Cocos2d-x'],
    'Python':          ['Kivy','BeeWare (Briefcase)'],
    'Rust':            ['Tauri Mobile','Dioxus Native'],
    'Go':              ['Fyne (Mobile)'],
    'Ruby':            ['RubyMotion'],
  };


  function updateTechOptions() {
    const role      = document.getElementById('projRole').value;
    const techRow   = document.getElementById('techRow');
    const langSel   = document.getElementById('projLang');
    const frameSel  = document.getElementById('projFramework');
    const projType  = document.getElementById('projType').value;

    langSel.innerHTML  = '<option value="">— Select language —</option>';
    frameSel.innerHTML = '<option value="">— Select framework —</option>';

    if (!role) { techRow.style.display = 'none'; return; }
    techRow.style.display = '';

    // Choose correct language map
    const isMobile = projType === 'mobile-app';
    const map = isMobile ? MOBILE_LANGS : (TECH_MAP[role] || {});
    Object.keys(map).forEach(lang => {
      langSel.innerHTML += `<option value="${lang}">${lang}</option>`;
    });
  }

  function updateFrameworks() {
    const role     = document.getElementById('projRole').value;
    const lang     = document.getElementById('projLang').value;
    const frameSel = document.getElementById('projFramework');
    const projType = document.getElementById('projType').value;

    frameSel.innerHTML = '<option value="">— Select framework —</option>';
    const isMobile = projType === 'mobile-app';
    const map = isMobile ? MOBILE_LANGS : (TECH_MAP[role] || {});
    const frameworks = map[lang] || [];
    frameworks.forEach(fw => {
      frameSel.innerHTML += `<option value="${fw}">${fw}</option>`;
    });
  }

  document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
{% endblock %}
