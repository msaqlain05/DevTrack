{% extends "base.html" %}
{% block title %}DevTrack – Dashboard{% endblock %}

{% block content %}
<div class="page-header flex-between">
  <div>
    <h1>Dashboard</h1>
    <p class="text-muted text-sm mt-1" id="welcomeLine">Loading…</p>
  </div>
</div>

<div class="grid-2">
  <!-- ── Projects ────────────────────────────── -->
  <section>
    <div class="section-header">
      <h2>Projects</h2>
      <button class="btn btn-sm" id="newProjBtn" onclick="toggleProjectForm()">＋ New project</button>
    </div>

    <!-- Inline create form with CSS animation -->
    <div class="inline-form" id="projectForm">
      <div class="inline-form-inner">
        <form onsubmit="handleCreateProject(event)">
          <div class="form-group">
            <label class="form-label">Project name*</label>
            <input class="form-control" id="projName" placeholder="e.g. My API" required>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input class="form-control" id="projDesc" placeholder="Optional">
          </div>
          <div class="flex gap-2" style="justify-content:flex-end">
            <button type="button" class="btn btn-ghost btn-sm" onclick="toggleProjectForm()">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm" id="projSubmitBtn">Create</button>
          </div>
        </form>
      </div>
    </div>

    <div id="projectsList">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </section>

  <!-- ── Tasks ──────────────────────────────── -->
  <section>
    <div class="section-header">
      <h2>Your Tasks</h2>
      <span class="badge badge-pending" id="taskCount" style="display:none"></span>
    </div>
    <div id="tasksList">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (!localStorage.getItem('token')) window.location.href = '/login';

  let projectsCache = {};

  function toggleProjectForm() {
    const form = document.getElementById('projectForm');
    const btn  = document.getElementById('newProjBtn');
    const open = form.classList.toggle('open');
    btn.textContent = open ? '✕ Cancel' : '＋ New project';
    if (open) setTimeout(() => document.getElementById('projName').focus(), 50);
  }

  async function loadDashboard() {
    try {
      const [projects, tasks] = await Promise.all([
        apiFetch('/projects/'),
        apiFetch('/tasks/')
      ]);

      // Welcome line
      document.getElementById('welcomeLine').textContent =
        `${projects.length} project${projects.length !== 1 ? 's' : ''} · ${tasks.length} task${tasks.length !== 1 ? 's' : ''}`;

      // Render Projects
      const pList = document.getElementById('projectsList');
      pList.innerHTML = '';
      if (!projects.length) {
        pList.innerHTML = `<div class="empty-state">
          <span class="empty-icon">🗂</span>
          <p>No projects yet.<br>Create one to get started.</p></div>`;
      } else {
        projects.forEach((p, i) => {
          projectsCache[p.id] = p;
          const card = document.createElement('a');
          card.className = 'project-card';
          card.href = `/project/${p.id}`;
          card.style.animationDelay = `${i * 0.05}s`;
          card.innerHTML = `
            <div class="card-title">${escHtml(p.name)}</div>
            <div class="card-meta">${p.description ? escHtml(p.description) : 'No description'}</div>`;
          pList.appendChild(card);
        });
      }

      // Render Tasks
      const tList = document.getElementById('tasksList');
      tList.innerHTML = '';

      // Task count badge
      const countBadge = document.getElementById('taskCount');
      if (tasks.length) {
        countBadge.textContent = `${tasks.length} total`;
        countBadge.style.display = '';
      }

      if (!tasks.length) {
        tList.innerHTML = `<div class="empty-state">
          <span class="empty-icon">✅</span>
          <p>No tasks yet.<br>Open a project and add some!</p></div>`;
      } else {
        tasks.forEach((t, i) => {
          const proj    = projectsCache[t.project_id];
          const isDone  = t.status === 'completed';
          const item    = document.createElement('div');
          item.className = `task-item${isDone ? ' done' : ''}`;
          item.style.animationDelay = `${i * 0.04}s`;
          item.innerHTML = `
            <div>
              <div class="task-title">${escHtml(t.title)}</div>
              <div class="task-meta">
                <span class="badge badge-${t.status}">${t.status.replace('-',' ')}</span>
                ${proj ? `<span>· in <strong>${escHtml(proj.name)}</strong></span>` : ''}
                ${t.date ? `<span>· 🗓 ${t.date}</span>` : ''}
              </div>
            </div>
            <div class="task-actions">
              ${!isDone ? `<button class="btn btn-sm btn-primary" onclick="markDone(${t.id})">✔ Done</button>` : ''}
            </div>`;
          tList.appendChild(item);
        });
      }
    } catch (err) {
      console.error('Dashboard error:', err);
    }
  }

  async function handleCreateProject(e) {
    e.preventDefault();
    const name = document.getElementById('projName').value.trim();
    const desc = document.getElementById('projDesc').value.trim();
    const btn  = document.getElementById('projSubmitBtn');

    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      await apiFetch('/projects/', {
        method: 'POST',
        body: JSON.stringify({ name, description: desc || null })
      });
      toggleProjectForm();
      document.getElementById('projName').value = '';
      document.getElementById('projDesc').value = '';
      showToast('Project created!', 'success');
      loadDashboard();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Create';
    }
  }

  async function markDone(taskId) {
    try {
      await apiFetch(`/tasks/${taskId}`, { method: 'PUT', body: JSON.stringify({ status: 'completed' }) });
      showToast('Task completed! 🎉', 'success');
      loadDashboard();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // XSS protection
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
{% endblock %}
