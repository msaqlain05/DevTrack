{% extends "base.html" %}

{% block title %}DevTrack - Authentication{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card" id="authCard">
        <!-- JS toggles between Login and Signup modes -->
        <h2 id="authTitle">Sign In</h2>
        <div id="authAlert" class="alert alert-error"></div>
        
        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="developer@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%" id="authBtn">Sign In</button>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
            <a href="#" id="authToggle" onclick="toggleMode(event)">Need an account? Sign up</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let isLogin = window.location.pathname.includes('login');

    // Make sure we redirect away if already logged in!
    if (localStorage.getItem('token')) {
        window.location.href = '/dashboard';
    }

    // Checking for expiration redirect
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('expired')) {
        showError('authAlert', 'Session expired. Please log in again.');
    }

    function toggleMode(e) {
        if(e) e.preventDefault();
        isLogin = !isLogin;
        
        document.getElementById('authTitle').innerText = isLogin ? 'Sign In' : 'Create Account';
        document.getElementById('authBtn').innerText = isLogin ? 'Sign In' : 'Sign Up';
        document.getElementById('authToggle').innerText = isLogin ? 'Need an account? Sign up' : 'Already have an account? Sign in';
        document.getElementById('authAlert').style.display = 'none';
        
        // Update URL cleanly
        window.history.replaceState(null, '', isLogin ? '/login' : '/signup');
    }
    
    // Set initial state correctly if accessing /signup directly
    if (!isLogin) {
        isLogin = true; // Flips it back when calling toggleMode
        toggleMode();
    }

    async function handleAuth(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('authAlert');
        
        alertBox.style.display = 'none';

        try {
            document.getElementById('authBtn').disabled = true;

            if (isLogin) {
                // Login expects FormData (OAuth2 compat)
                const formData = new URLSearchParams();
                formData.append('username', email); // OAuth2 expects 'username' not 'email'
                formData.append('password', password);
                
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                if (!response.ok) {
                    const data = await response.json().catch(()=>({}));
                    throw new Error(data.detail || 'Invalid credentials');
                }
                
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard';

            } else {
                // Signup expects JSON logic as we built it
                await apiFetch('/auth/signup', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                
                // Immediately auto-login
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard';
            }
        } catch (err) {
            showError('authAlert', err.message);
        } finally {
            document.getElementById('authBtn').disabled = false;
        }
    }
</script>
{% endblock %}
