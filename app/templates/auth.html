{% extends "base.html" %}
{% block title %}DevTrack – Sign In{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="brand">
        <span class="brand-dot"></span>DevTrack
      </div>
      <p class="text-muted text-sm" style="margin-top:.5rem;">Developer-focused project tracker</p>
    </div>

    <div id="authAlert" class="alert alert-error"></div>

    <h2 id="authTitle" style="margin-bottom:1.5rem;font-size:1.15rem;">Welcome back</h2>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-control" type="email" id="email"
               placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password"
               placeholder="••••••••" autocomplete="current-password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary w-full" id="authBtn"
              style="margin-top:.25rem; padding:.65rem;">
        Sign In
      </button>
    </form>

    <div class="auth-divider">or</div>

    <p class="text-center text-sm text-muted">
      <span id="authToggleText">Don't have an account?</span>
      <a href="#" id="authToggle" onclick="toggleMode(event)" style="margin-left:.25rem;">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let isLogin = !window.location.pathname.includes('signup');

  if (localStorage.getItem('token')) window.location.href = '/dashboard';

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('expired')) showError('authAlert', 'Session expired — please log in again.');

  function setMode(login) {
    isLogin = login;
    document.getElementById('authTitle').textContent   = login ? 'Welcome back' : 'Create account';
    document.getElementById('authBtn').textContent     = login ? 'Sign In' : 'Sign Up';
    document.getElementById('authToggleText').textContent = login ? "Don't have an account?" : 'Already have an account?';
    document.getElementById('authToggle').textContent  = login ? 'Sign up' : 'Sign in';
    document.getElementById('authAlert').style.display = 'none';
    window.history.replaceState(null, '', login ? '/login' : '/signup');
  }

  function toggleMode(e) { e.preventDefault(); setMode(!isLogin); }

  setMode(isLogin); // Apply initial state

  async function handleAuth(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('authBtn');

    document.getElementById('authAlert').style.display = 'none';
    btn.disabled = true;
    btn.textContent = isLogin ? 'Signing in…' : 'Creating account…';

    try {
      if (!isLogin) {
        try {
          await apiFetch('/auth/signup', {
            method: 'POST',
            body: JSON.stringify({ email, password })
          });
        } catch (signupErr) {
          // Account already exists (double submit or returning user) — try login
          const msg = String(signupErr.message || '');
          if (!msg.includes('Email already registered')) throw signupErr;
        }
      }

      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.detail || 'Invalid credentials');
      }
      const { access_token } = await res.json();
      localStorage.setItem('token', access_token);
      window.location.href = '/dashboard';

    } catch (err) {
      showError('authAlert', err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = isLogin ? 'Sign In' : 'Sign Up';
    }
  }
</script>
{% endblock %}
